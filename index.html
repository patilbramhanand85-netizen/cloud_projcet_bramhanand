<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cloud Storage System</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="sidebar">
    <h2>☁ CloudBox</h2>
    <a href="#">🏠 Dashboard</a>
    <a href="#files">📁 My Files</a>
    <a href="#storage">💾 Storage</a>
    <a href="#">⚙ Settings</a>
</div>

<div class="main">

    <div class="header">
        <h1>Cloud Dashboard</h1>
        <button class="upload" onclick="document.getElementById('fileInput').click()">
            + Upload File
        </button>
        <input type="file" id="fileInput" multiple hidden onchange="uploadFiles()">
    </div>

    <div class="cards">
        <div class="card">
            <h3>Total Files</h3>
            <h2 id="totalFiles">0</h2>
        </div>

        <div class="card">
            <h3>Storage Used</h3>
            <h2 id="usedStorage">0 MB</h2>
        </div>

        <div class="card">
            <h3>Storage Available</h3>
            <h2 id="availableStorage">100 MB</h2>
        </div>
    </div>

    <div class="storage" id="storage">
        <h2>Storage Overview</h2>
        <p id="storageText">0 MB used out of 100 MB</p>
        <div class="progress">
            <div class="progress-bar" id="progressBar"></div>
        </div>
    </div>

    <div class="files" id="files">
        <h2>My Files</h2>
        <input type="text" class="search"
               id="search" placeholder="Search your files..."
               oninput="displayFiles()">

        <div id="fileList">
            <p class="empty">No files uploaded yet.</p>
        </div>
    </div>

</div>

<script src="script.js"></script>
</body>
</html>
